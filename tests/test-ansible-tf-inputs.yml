name: Test Ansible and Terraform State Inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          # AWS credentials (fake — will cause graceful failure)
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_session_token: fake-session-token
          aws_additional_tags: '{"test-tag": "test-value"}'
          aws_default_region: us-east-1
          aws_resource_identifier: test-harness-ansible-tf

          # Terraform state inputs
          tf_state_file_name: test-state-file
          tf_state_file_name_append: unique
          tf_state_bucket: test-tf-state-bucket
          tf_targets: module.ec2

          # Ansible inputs
          ansible_skip: 'true'
          ansible_ssh_to_private_ip: 'false'
          ansible_start_docker_timeout: '300'

          # bitops_code_store
          bitops_code_store: 'false'

          # Disable checkout since we already checked out
          checkout: 'false'

      - name: Assert action ran (fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with fake credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
