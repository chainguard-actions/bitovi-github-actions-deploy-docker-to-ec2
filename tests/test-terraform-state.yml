name: Test Terraform state and stack management inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify Terraform inputs are declared in action.yml
        run: |
          for input in tf_stack_destroy tf_state_file_name tf_state_file_name_append tf_state_bucket tf_state_bucket_destroy tf_targets; do
            if ! grep -q "  ${input}:" "$GITHUB_WORKSPACE/action.yml"; then
              echo "FAIL: input '${input}' not found in action.yml"
              exit 1
            fi
            echo "PASS: input '${input}' declared"
          done
      - id: action
        uses: .
        with:
          aws_access_key_id: "AKIAIOSFODNN7EXAMPLE"
          aws_secret_access_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          tf_stack_destroy: "false"
          tf_state_file_name: "my-custom-state"
          tf_state_file_name_append: "unique"
          tf_state_bucket: "my-org-tf-state-bucket"
          tf_state_bucket_destroy: "false"
          tf_targets: "module.ec2"
          bitops_code_only: "true"
          checkout: "false"
        continue-on-error: true
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to missing real AWS credentials)"
          echo "PASS: Terraform state inputs were passed to action"
