name: Test EFS configuration inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with EFS inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_code_only: 'true'
          aws_default_region: us-east-1
          aws_resource_identifier: test-harness-efs
          aws_ec2_instance_create: 'true'
          # EFS inputs
          aws_efs_create: 'true'
          aws_efs_create_ha: 'true'
          aws_efs_vol_encrypted: 'true'
          aws_efs_performance_mode: generalPurpose
          aws_efs_throughput_mode: bursting
          aws_efs_enable_backup_policy: 'true'
          docker_efs_mount_target: /data

      - name: Assert action accepted EFS inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with EFS inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
