name: Test environment file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          env_aws_secret: my-aws-secret-name
          env_ghs: MY_GH_SECRET
          env_ghv: MY_GH_VARIABLE
          env_repo: .env
          bitops_code_store: 'true'
          bitops_code_only: 'true'
          checkout: 'false'
      - name: Assert action ran (success or graceful failure without real AWS)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME' (env inputs accepted)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
