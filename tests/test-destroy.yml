name: Test stack destroy scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action with destroy flag
        id: action
        uses: .
        continue-on-error: true
        with:
          checkout: 'false'
          bitops_code_only: 'true'
          aws_default_region: us-east-1
          aws_resource_identifier: test-harness-destroy
          tf_stack_destroy: 'true'
          tf_state_bucket_destroy: 'true'

      - name: Assert action accepted destroy inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action completed successfully with destroy inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without real AWS credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
