name: Test AWS credentials and Terraform state inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          aws_access_key_id: fake-key-id
          aws_secret_access_key: fake-secret-key
          aws_session_token: fake-session-token
          aws_additional_tags: '{"test-key": "test-value"}'
          tf_state_bucket: my-tf-state-bucket
          tf_state_file_name: my-tf-state
          tf_state_file_name_append: unique
          tf_targets: module.ec2
          bitops_code_only: 'true'
          checkout: 'false'
      - name: Assert action ran (success or graceful failure with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome '$OUTCOME' (fake AWS credentials expected to fail)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
