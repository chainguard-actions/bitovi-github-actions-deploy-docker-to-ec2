name: Test Ansible configuration and environment file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify Ansible and env inputs are declared in action.yml
        run: |
          for input in ansible_skip ansible_ssh_to_private_ip ansible_start_docker_timeout env_aws_secret env_repo env_ghs env_ghv; do
            if ! grep -q "  ${input}:" "$GITHUB_WORKSPACE/action.yml"; then
              echo "FAIL: input '${input}' not found in action.yml"
              exit 1
            fi
            echo "PASS: input '${input}' declared"
          done
      - id: action
        uses: .
        with:
          aws_access_key_id: "AKIAIOSFODNN7EXAMPLE"
          aws_secret_access_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
          ansible_skip: "true"
          ansible_ssh_to_private_ip: "false"
          ansible_start_docker_timeout: "300"
          env_aws_secret: "my-app-secrets"
          env_repo: ".env.production"
          env_ghs: "MY_APP_ENV_SECRET"
          env_ghv: "MY_APP_ENV_VAR"
          bitops_code_only: "true"
          checkout: "false"
        continue-on-error: true
      - name: Assert action was invoked
        run: |
          echo "Action step completed (may have failed due to missing real AWS credentials)"
          echo "PASS: Ansible and env inputs were passed to action"
